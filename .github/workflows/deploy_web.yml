name: Auto Build & Deploy Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - 'artisan_hub/**'
      - '.github/workflows/deploy_web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          cd artisan_hub
          flutter pub get
          flutter build web --release

      - name: Commit & Push Updated Build Bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artisan_hub/build/web artisan_hub/.gitignore .gitignore
          if git diff --staged --quiet; then
            echo "No changes in compiled web bundle."
          else
            git commit -m "auto: compiled flutter web release bundle [skip ci]"
            git push origin main
          fi
